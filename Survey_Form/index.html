<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form method="post" id="survey-form">

      <fieldset>
        <label for="name" id="name-label">Name
          <input id="name" type="text" placeholder="Enter your Name" required />
        </label>
        <label for="email" id="email-label">Email
          <input id="email" type="email" placeholder="Enter your Email" required />
        </label>
        <label for="number" id="number-label">Age (optional)
          <input id="number" type="number" min="15" max="120" placeholder="Age"/>
        </label>
        <label for="role">Which option best describes your current role?
          <select id="role-dropdown" name="role">
            <option>Select current role</option>
            <option>Student</option>
            <option>Full Time Job</option>
            <option>Full Time Learner</option>
            <option>Prefer Not to say</option>
            <option>Other</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <label>Would you recommend freeCodeCamp to a friend?</label>
        <label><input type="radio" name="recommend" value="Definitely" />Definitely</label>
        <label><input type="radio" name="recommend" value="Maybe"/>Maybe</label>
        <label><input type="radio" name="recommend" value="Not Sure"/>Not sure</label>
      </fieldset>

      <fieldset>
        <label for="feature">What is your favorite feature of freeCodeCamp?
          <select id="feature-dropdown" name="feature">
            <option>Select an option</option>
            <option>Challenges</option>
            <option>Projects</option>
            <option>Community</option>
            <option>Open Source</option>
          </select>
        </label>

        <label>What would you like to see improved? (Check all that apply)</label>
        <label><input type="checkbox" value="Front-end Project" />Front-end Project</label>
        <label><input type="checkbox" value="Back-end Project"/>Back-end Project</label>
        <label><input type="checkbox" value="Data Visualization"/>Data Visualization</label>
        <label><input type="checkbox" value="Challenges"/>Challenges</label>
        <label><input type="checkbox" value="Open Source Community"/>Open Source Community</label>
        <label><input type="checkbox" value="Gift Help Rooms"/>Gift Help Rooms</label>
        <label><input type="checkbox" value="Videos"/>Videos</label>
        <label><input type="checkbox" value="City Meetups"/>City Meetups</label>
        <label><input type="checkbox" value="Wiki"/>Wiki</label>
        <label><input type="checkbox" value="Forum"/>Forum</label>
        <label><input type="checkbox" value="Additional Courses"/>Additional Courses</label>
      </fieldset>

      <fieldset>
        <label for="comments">Any comments or suggestions?
          <textarea id="comments" placeholder="Enter your comment here..."></textarea>
        </label>
      </fieldset>

      <fieldset>
        <input type="submit" value="Submit" id="submit" />
      </fieldset>

    </form>
  </body>
</html>
