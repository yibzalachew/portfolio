<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="registe">
    <h1>Cash Register Project</h1>
    <div id="change-due"></div>
    </div>
       <div>
      <p>Enter cash from customer:</p>
      <input type="number" id="cash" placeholder="Cash from customer" />
    </div>
    <button id="purchase-btn"> Purchase</button>
  </div>
    <div class="box">
      <div>
        <p>Total: $<span id="price">3.26</span></p>
        <h3>Change in drawer:</h3>
        <div id="cash-drawer">
          <p>Pennies: $<span id="penny">1.01</span></p>
          <p>Nickels: $<span id="nickel">2.05</span></p>
          <p>Dimes: $<span id="dime">3.10</span></p>
          <p>Quarters: $<span id="quarter">4.25</span></p>
          <p>Ones: $<span id="one">90.00</span></p>
          <p>Fives: $<span id="five">55.00</span></p>
          <p>Tens: $<span id="ten">20.00</span></p>
          <p>Twenties: $<span id="twenty">60.00</span></p>
          <p>Hundreds: $<span id="hundred">100.00</span></p>
        </div>
      </div>
      <div id="change-due"></div>
    </div>

 

  <script src="script.js"></script>
</body>
</html>
